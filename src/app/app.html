<!--
  App Component Template
  
  Root template for the Calculator application.
  
  Structure:
  1. :host style - Makes this component fill viewport with light background
  2. main-container - Centering wrapper with gradient background (defined in app.css)
  3. content-wrapper - White rounded box that holds the app content
  4. h1 - Large fancy title with gradient text effect
  5. app-calculator - Calculator component (standalone)
  
  The layout is responsive and adapts to mobile/tablet/desktop via media queries
  in app.css using breakpoints at 768px, 480px, 375px, and 320px.
-->

<style>
  /* Host element styling - makes component fill entire viewport */
  :host {
    margin: 0;
    padding: 0;
    background: #f0f2f5;
    display: block;
    width: 100%;
    min-height: 100vh;
  }
</style>

<!-- Main container with gray gradient background - centered layout -->
<div class="main-container">
  <!-- Content wrapper: white rounded box with shadow -->
  <div class="content-wrapper">
    <!-- Application title with gradient text effect -->
    <h1>Calculator App</h1>
    <!-- Calculator component: displays buttons, display screen, and handles user input -->
    <app-calculator></app-calculator>
  </div>
</div>
<div class="main-container">
  <div class="content-wrapper">
    <app-calculator></app-calculator>
  </div>
</div>
        viewBox="0 0 982 239"

        fill="none"

        class="angular-logo"
