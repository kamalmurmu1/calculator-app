<!--
  Calculator Component Template
  
  The calculator UI with:
  1. Display screen - shows full expression (e.g., "6 + 5 * 2")
  2. Button grid - 4 columns, 7 rows with 26 buttons total
  
  Button Layout:
  AC    DEL   /    ×
  7     8     9    -
  4     5     6    +
  1     2     3    .
  0(x2)       =(x2)
  
  CSS Grid ensures:
  - Uniform button sizing across all devices
  - Responsive scaling via media queries (768px, 480px, 375px, 320px)
  - Equal/zero buttons span 2 columns
  - Touch-friendly tap targets
  
  Event Handlers:
  - Number buttons: appendNumber(n) - adds digit to display
  - Operators (+,-,×,/): setOperation(op) - queues operator for BODMAS evaluation
  - Decimal: appendDecimal() - adds . to current number
  - AC: clear() - reset calculator
  - DEL: backspace() - remove last digit
  - =: calculate() - evaluate full expression with precedence
-->

<div class="calculator-container">
  <!-- Display Screen: Shows current expression in monospace font -->
  <div class="display">{{ fullExpression }}</div>
  
  <!-- Button Grid: 4 columns, auto-sized rows with 10px gaps -->
  <div class="buttons">
    <!-- Row 1: Function and operator buttons -->
    <button class="button function" (click)="clear()">AC</button>
    <button class="button function" (click)="backspace()">DEL</button>
    <button class="button operator" (click)="setOperation('/')">/</button>
    <button class="button operator" (click)="setOperation('*')">×</button>

    <!-- Row 2: Number row 7-9 with minus operator -->
    <button class="button" (click)="appendNumber('7')">7</button>
    <button class="button" (click)="appendNumber('8')">8</button>
    <button class="button" (click)="appendNumber('9')">9</button>
    <button class="button operator" (click)="setOperation('-')">-</button>

    <!-- Row 3: Number row 4-6 with plus operator -->
    <button class="button" (click)="appendNumber('4')">4</button>
    <button class="button" (click)="appendNumber('5')">5</button>
    <button class="button" (click)="appendNumber('6')">6</button>
    <button class="button operator" (click)="setOperation('+')">+</button>

    <!-- Row 4: Number row 1-3 with decimal point -->
    <button class="button" (click)="appendNumber('1')">1</button>
    <button class="button" (click)="appendNumber('2')">2</button>
    <button class="button" (click)="appendNumber('3')">3</button>
    <button class="button" (click)="appendDecimal()">.</button>

    <!-- Row 5: Zero button (spans 2 cols) and equals button (spans 2 cols) -->
    <button class="button zero" (click)="appendNumber('0')">0</button>
    <button class="button equals" (click)="calculate()">=</button>
  </div>
</div>
